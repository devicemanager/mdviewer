name: Build and Notarize macOS

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  PROJECT: "MDViewer.xcodeproj"
  SCHEME: "MDViewer"
  CONFIGURATION: "Release"
  APP_NAME: "MDViewer"
  BUILD_DIR: "build"
  DERIVED_DATA: "build/DerivedData"
  APP_PATH: "build/DerivedData/Build/Products/Release/MDViewer.app"
  ZIP_PATH: "build/MDViewer.zip"

jobs:
  build-and-notarize:
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create keychain and import Developer ID certificate
        if: secrets.DEVELOPER_ID_P12 != ''
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          security create-keychain -p actions temp-build.keychain
          security default-keychain -s temp-build.keychain
          security unlock-keychain -p actions temp-build.keychain
          security set-keychain-settings -t 3600 -l temp-build.keychain
          echo "$P12_BASE64" | base64 --decode > /tmp/developer_id.p12
          security import /tmp/developer_id.p12 -k ~/Library/Keychains/temp-build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign

      - name: Store notarytool credentials in keychain
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          xcrun notarytool store-credentials "notarytool" \
            --key /tmp/AuthKey.p8 \
            --key-id "$APPLE_KEY_ID" \
            --issuer "$APPLE_ISSUER_ID"

      - name: Clean
        run: |
          rm -rf "${{ env.BUILD_DIR }}"
          mkdir -p "${{ env.BUILD_DIR }}"

      - name: Build (Developer ID + hardened runtime + secure timestamp)
        run: |
          xcodebuild \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -derivedDataPath "${{ env.DERIVED_DATA }}" \
            -destination 'generic/platform=macOS' \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            clean build

      - name: Verify build output
        run: |
          if [[ ! -d "${{ env.APP_PATH }}" ]]; then
            echo "error: build did not produce ${{ env.APP_PATH }}" >&2
            exit 1
          fi

      - name: Zip for notarization
        run: |
          ditto -c -k --sequesterRsrc --keepParent "${{ env.APP_PATH }}" "${{ env.ZIP_PATH }}"

      - name: Submit to notarytool and wait
        run: |
          xcrun notarytool submit "${{ env.ZIP_PATH }}" --keychain-profile "notarytool" --wait

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple "${{ env.APP_PATH }}"

      - name: Create final stapled zip
        run: |
          rm -f "${{ env.ZIP_PATH }}"
          ditto -c -k --sequesterRsrc --keepParent "${{ env.APP_PATH }}" "${{ env.ZIP_PATH }}"

      - name: Verify signature & notarization
        run: |
          xcrun stapler validate "${{ env.APP_PATH }}"
          spctl -a -vvv -t install "${{ env.APP_PATH }}" || true

      - name: Upload notarized artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dev-id-notarized
          path: ${{ env.ZIP_PATH }}

      - name: Create Release asset (on tag push)
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}